name: Release

# Tags publish Mac and plugin release assets. A dispatch from main publishes
# only the Git marketplace, for initial setup without creating a release tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: reader-release-distribution
  cancel-in-progress: false

jobs:
  plugin:
    name: Build plugin distribution
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix src/reader/chatgpt --ignore-scripts
      - run: npm run build:chatgpt
      - name: Validate and package plugin
        shell: bash
        run: |
          TAG_ARGS=()
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG_ARGS=(--tag "$GITHUB_REF_NAME")
          fi
          python3 scripts/plugin_release.py stage \
            --plugin-dir build/chatgpt --version-file VERSION \
            "${TAG_ARGS[@]}" --source-commit "$GITHUB_SHA" \
            --repository-url "https://github.com/$GITHUB_REPOSITORY" \
            --output-dir build/plugin-marketplace --archive-dir build/releases
      - uses: actions/upload-artifact@v4
        with:
          name: reader-plugin-marketplace
          path: build/plugin-marketplace/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: reader-plugin-zip
          path: build/releases/Reader-plugin-*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: plugin
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($FILE_VERSION)." >&2
            echo "Bump VERSION and commit it before tagging a release." >&2
            exit 1
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"

      - name: Import signing identity
        id: sign
        env:
          READER_SIGNING_P12_BASE64: ${{ secrets.READER_SIGNING_P12_BASE64 }}
          READER_SIGNING_P12_PASSWORD: ${{ secrets.READER_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$READER_SIGNING_P12_BASE64" ] || [ -z "$READER_SIGNING_P12_PASSWORD" ]; then
            echo "No signing secrets configured; building ad-hoc." >&2
            echo "### :warning: Ad-hoc build" >> "$GITHUB_STEP_SUMMARY"
            echo "READER_SIGNING_P12_BASE64 / READER_SIGNING_P12_PASSWORD are not set," \
                 "so this release is signed ad-hoc. Run" \
                 "\`./src/reader/macos/scripts/export-signing-identity.sh\` once to fix that." \
                 >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/reader-release.keychain-db"
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/reader-signing.p12"

          echo "$READER_SIGNING_P12_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$READER_SIGNING_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          # Without a partition list, codesign raises a confirmation dialog per
          # signature instead of none -- fatal on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # codesign finds an identity by searching the user's keychain list,
          # not just the one named with --keychain, so the new keychain has to
          # join that list rather than replace it.
          EXISTING_KEYCHAINS=()
          while IFS= read -r entry; do
            entry="${entry//\"/}"
            entry="$(printf '%s' "$entry" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$entry" ] && EXISTING_KEYCHAINS+=("$entry")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"

          rm -f "$P12_PATH"

          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Reader.app
        env:
          CODE_SIGN_IDENTITY: ${{ steps.sign.outputs.signed == 'true' && 'Reader Local Signing' || '' }}
        run: ./src/reader/macos/scripts/build-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict build/Reader.app

      - name: Package and write manifest
        run: ./src/reader/macos/scripts/write-release-manifest.sh "$VERSION"

      - name: Build disk image
        run: ./src/reader/macos/scripts/write-release-dmg.sh "$VERSION"

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${{ steps.sign.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
          fi

      - name: Extract changelog section
        run: ./src/reader/macos/scripts/extract-changelog.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Download plugin release asset
        uses: actions/download-artifact@v4
        with:
          name: reader-plugin-zip
          path: build/releases/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "build/releases/Reader-$VERSION.zip" \
            "build/releases/Reader-$VERSION.dmg" \
            "build/releases/Reader-plugin-$VERSION.zip" \
            build/releases/manifest.json \
            --title "Reader $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

  marketplace:
    name: Publish Git marketplace
    needs: [plugin, release]
    if: >-
      always() && needs.plugin.result == 'success' &&
      (needs.release.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reader-plugin-marketplace
          path: build/plugin-marketplace/
      - name: Publish validated plugin files and catalog
        shell: bash
        run: |
          # Reuse checkout's job-scoped credentials without putting a token in URLs.
          READER_GIT_AUTH="$(git config --get http.https://github.com/.extraheader)"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0='http.https://github.com/.extraheader'
          export GIT_CONFIG_VALUE_0="$READER_GIT_AUTH"
          python3 scripts/plugin_release.py publish \
            --stage-dir build/plugin-marketplace \
            --checkout "$RUNNER_TEMP/reader-plugin-marketplace" \
            --remote "https://github.com/$GITHUB_REPOSITORY.git" \
            --branch plugin-marketplace

name: Release

# A pushed tag is the only trigger. The tag is the release: its name fixes the
# version, and CI's job is just to prove the build matches what VERSION says.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches VERSION
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($FILE_VERSION)." >&2
            echo "Bump VERSION and commit it before tagging a release." >&2
            exit 1
          fi
          echo "VERSION=$FILE_VERSION" >> "$GITHUB_ENV"

      - name: Import signing identity
        id: sign
        env:
          READER_SIGNING_P12_BASE64: ${{ secrets.READER_SIGNING_P12_BASE64 }}
          READER_SIGNING_P12_PASSWORD: ${{ secrets.READER_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$READER_SIGNING_P12_BASE64" ] || [ -z "$READER_SIGNING_P12_PASSWORD" ]; then
            echo "No signing secrets configured; building ad-hoc." >&2
            echo "### :warning: Ad-hoc build" >> "$GITHUB_STEP_SUMMARY"
            echo "READER_SIGNING_P12_BASE64 / READER_SIGNING_P12_PASSWORD are not set," \
                 "so this release is signed ad-hoc. Run" \
                 "\`./macos/export-signing-identity.sh\` once to fix that." \
                 >> "$GITHUB_STEP_SUMMARY"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/reader-release.keychain-db"
          KEYCHAIN_PASSWORD="$(/usr/bin/openssl rand -hex 24)"
          P12_PATH="$RUNNER_TEMP/reader-signing.p12"

          echo "$READER_SIGNING_P12_BASE64" | base64 --decode > "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12_PATH" -k "$KEYCHAIN" -P "$READER_SIGNING_P12_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          # Without a partition list, codesign raises a confirmation dialog per
          # signature instead of none -- fatal on a headless runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # codesign finds an identity by searching the user's keychain list,
          # not just the one named with --keychain, so the new keychain has to
          # join that list rather than replace it.
          EXISTING_KEYCHAINS=()
          while IFS= read -r entry; do
            entry="${entry//\"/}"
            entry="$(printf '%s' "$entry" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -n "$entry" ] && EXISTING_KEYCHAINS+=("$entry")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING_KEYCHAINS[@]}"

          rm -f "$P12_PATH"

          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build Reader.app
        env:
          CODE_SIGN_IDENTITY: ${{ steps.sign.outputs.signed == 'true' && 'Reader Local Signing' || '' }}
        run: ./macos/build-app.sh

      - name: Verify signature
        run: codesign --verify --deep --strict install/Reader.app

      - name: Package and write manifest
        run: ./macos/write-release-manifest.sh "$VERSION"

      - name: Build disk image
        run: ./macos/write-release-dmg.sh "$VERSION"

      - name: Delete temporary keychain
        if: always()
        run: |
          if [ -n "${{ steps.sign.outputs.keychain }}" ]; then
            security delete-keychain "${{ steps.sign.outputs.keychain }}" || true
          fi

      - name: Extract changelog section
        run: ./macos/extract-changelog.sh "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "Reader-$VERSION.zip" \
            "Reader-$VERSION.dmg" \
            manifest.json \
            --title "Reader $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

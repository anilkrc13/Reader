name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  browser:
    name: WebMCP browser suite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Diagnose the runner's view of the server
        run: |
          set -x
          mkdir -p /tmp/rstate /tmp/rws
          READER_DATA_DIR=/tmp/rstate python3 reader.py /tmp/rws --port 8790 --no-browser > /tmp/reader.log 2>&1 &
          sleep 3
          cat /tmp/reader.log
          TOKEN="$(cat /tmp/rstate/.reader-token)"
          curl -sSi "http://127.0.0.1:8790/?t=$TOKEN" | head -20
          curl -sSi -H "Cookie: reader_session=$TOKEN" "http://127.0.0.1:8790/" | head -20
          curl -sSi -H "Cookie: reader_session=$TOKEN" "http://127.0.0.1:8790/api/ping"
          python3 -c "import mimetypes,sys; print(sys.version); print(mimetypes.guess_type('index.html'), mimetypes.guess_type('app.js'), mimetypes.guess_type('app.css'))"
          kill %1 || true
      - run: npm run test:webmcp
        env:
          READER_PLAYWRIGHT_CHANNEL: chromium
      - name: Keep the failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-test-results
          path: test-results/
          if-no-files-found: ignore

  macos-app:
    name: macOS app builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Reader.app (ad-hoc signed)
        run: ./macos/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict install/Reader.app
          cmp reader.py install/Reader.app/Contents/Resources/reader.py
          cmp VERSION install/Reader.app/Contents/Resources/VERSION
